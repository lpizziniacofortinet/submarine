name: Tests

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run tests
        run: node --test tests/*.test.js
      - name: Check simulator JavaScript syntax
        run: |
          node --check js/main.js
          node --check js/stations.js
          node --check js/coastline.js
