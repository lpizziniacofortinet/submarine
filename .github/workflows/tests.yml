name: Tests

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run tests
        run: node --test tests/*.test.js
      - name: Check local launcher and TTS JavaScript syntax
        run: |
          bash -n start-local.sh
          node --check js/local-tts.js
          node --check tts-server/start.mjs
